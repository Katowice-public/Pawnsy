<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pawnsy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" width="40" height="40" />
      <div>
        <strong>Pawnsy</strong>
        <p id="rankline">Loading…</p>
      </div>
    </header>
    <a class="row" id="daily" href="#">
      <span>Daily puzzle</span>
      <em id="daily-name">…</em>
    </a>
    <a class="row" id="academy" href="#">Continue Academy</a>
    <a class="row" id="play" href="#">Play vs Pawnsy</a>
    <label class="toggle">
      <input type="checkbox" id="voice" checked />
      <span>Voice coach</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="siteCoach" checked />
      <span>Talk on Chess.com &amp; Lichess</span>
    </label>
    <p class="fine">Explains the move that just happened. No live engine lines on rated games.</p>
    <a class="open" id="open" href="#">Open Pawnsy</a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
